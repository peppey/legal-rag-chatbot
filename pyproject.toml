[project]
name = "legal-rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pia Baronetzky", email = "pia@baronetzky.org" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "google-cloud-aiplatform>=2.2.0",
    "google-cloud-documentai>=3.16.0",
    "google-cloud-storage>=3.15.0",
    "google-genai>=2.25.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
legal-rag-chatbot = "legal_rag_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
